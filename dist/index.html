<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Wendayew Fkadu - Software Engineer Portfolio. Passionate about building scalable, premium software across web, mobile, and backend technologies." />
    <title>Wendayew Fkadu | Software Engineer Portfolio</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet" />
  <script type="module" crossorigin src="/assets/index-Cut2tHW5.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-Cgjm1Qog.css">
</head>
<body>
    <div id="root"></div>
    <script>
      const root = document.getElementById("root");
      const documentLinksObserver = new MutationObserver(() => {
        const heroButtons = root.querySelector(".hero-buttons");
        if (!heroButtons) return;

        const documents = [
          ["Wendayew-Fkadu-Resume.pdf", "Download Resume"],
          ["Wendayew-Fkadu-Motivation-Letter.pdf", "Motivation Letter"]
        ];

        documents.forEach(([file, label]) => {
          const link = document.createElement("a");
          link.href = `/${file}`;
          link.download = file;
          link.className = "btn btn-secondary";
          link.textContent = label;
          heroButtons.appendChild(link);
        });

        documentLinksObserver.disconnect();
      });

      documentLinksObserver.observe(root, { childList: true, subtree: true });
    </script>
</body>
</html>
